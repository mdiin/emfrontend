name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            asset: linux-x64
            platform: linux
          - os: macos-latest
            asset: macos-arm64
            platform: macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: DeLaGuardo/setup-clojure@13.4
        with:
          cli: "latest"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install Linux desktop build deps
        if: matrix.platform == 'linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build libgtk-3-dev

      - name: Compile ClojureDart
        run: clojure -M:cljd compile

      - name: flutter build ${{ matrix.platform }}
        run: flutter build ${{ matrix.platform }} --release

      - name: Package (linux)
        if: matrix.platform == 'linux'
        run: |
          version="${GITHUB_REF_NAME#v}"
          dist="emfrontend-${version}-${{ matrix.asset }}"
          cp -r build/linux/x64/release/bundle "$dist"
          tar -czf "${dist}.tar.gz" "$dist"

      - name: Package (macos)
        if: matrix.platform == 'macos'
        run: |
          version="${GITHUB_REF_NAME#v}"
          dist="emfrontend-${version}-${{ matrix.asset }}"
          mkdir "$dist"
          cp -r build/macos/Build/Products/Release/*.app "$dist/"
          ditto -c -k --sequesterRsrc --keepParent "$dist" "${dist}.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: |
            emfrontend-*.tar.gz
            emfrontend-*.zip

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
